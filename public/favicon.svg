<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-ring-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29ABE2"/>
      <stop offset="100%" stop-color="#8DC63F"/>
    </linearGradient>
    <linearGradient id="fav-ring-bottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#662D91"/>
      <stop offset="100%" stop-color="#FF6321"/>
    </linearGradient>
  </defs>

  <!-- Ring — top arc: cyan → green -->
  <path d="M 7 50 A 43 43 0 0 1 93 50" fill="none" stroke="url(#fav-ring-top)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Ring — bottom arc: purple → orange -->
  <path d="M 7 50 A 43 43 0 0 0 93 50" fill="none" stroke="url(#fav-ring-bottom)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- EKG pulse line -->
  <path d="M 7 50 L 26 50 L 33 38 L 40 72 L 47 29 L 54 50 L 93 50" fill="none" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand-orange accent node at peak -->
  <circle cx="47" cy="29" r="5.5" fill="#FF6321"/>
</svg>
